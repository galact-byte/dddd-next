name: 检测准确性（误报 / 漏报）
description: 指纹识别、POC 判定或路径探测结果与实际不符
title: "[Detection] "
labels: ["detection"]
body:
  - type: markdown
    attributes:
      value: |
        这类反馈需要明确的判定依据才能定位到指纹库或 POC 规则，请尽量填全下面的字段。

        提交前请先搜索现有 issue，并用最新 [Release](https://github.com/galact-byte/dddd-next/releases/latest) 复现；README 的「已知限制」说明命中仍取决于模板兼容性、产品指纹和目标环境。

  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      description: 一次只反馈一个问题，多个问题请分开提交。
      options:
        - 指纹误报（识别成了错误的产品或服务）
        - 指纹漏报（目标产品未被识别）
        - POC 误报（报告存在漏洞，实际不存在）
        - POC 漏报（目标存在漏洞，未报告）
        - 路径探测误报（`dir.yaml` 报告了不存在的路径）
        - 严重等级或其他判定不符
    validations:
      required: true

  - type: input
    id: signature
    attributes:
      label: 命中的指纹名或 POC ID
      description: 指纹名见报告或 JSON 输出中的产品字段；POC 可用模板 ID 或 `-poc` 使用的名称片段，填不出可以写「未知」。
      placeholder: 例如 Atlassian-Confluence / CVE-2023-22515
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 扫描模式
      description: 不同模式走不同的检测路径，这一项决定复现方式。
      options:
        - 默认（指纹 + 精准 POC + GoPoC 弱口令 + Shiro）
        - 仅资产收集（`-no-poc`）
        - 指定 POC 名称 / ID（`-poc`）
        - 按模板标签筛选（`-tags`）
        - 全量 Nuclei 模板（`-full`）
    validations:
      required: true

  - type: textarea
    id: template_source
    attributes:
      label: 模板来源与版本
      description: 请说明使用官方 Nuclei 模板、内置 legacy POC 或自定义模板；有 `dddd update` 显示的模板版本或提交号时请一并提供。自定义指纹也请说明来源。未知可填「未知」，仅 GoPoC / Shiro 问题可填「不适用」。
      placeholder: 官方 nuclei-templates，提交号……；或自定义模板的公开链接 / 脱敏说明。
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 复现命令
      description: 完整命令行，包含端口范围、模板筛选等参数。请删除 FOFA_KEY 等凭证和敏感目标。
      render: shell
      placeholder: ./dddd -t https://example.com -p 443
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 目标特征或响应依据
      description: 误报贴出导致判定的关键响应头 / 正文片段，漏报贴出能证明产品存在或漏洞可用的信息。注意脱敏。
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望判定
      description: 你认为正确的结果是什么，以及判断依据来自哪里（产品文档、响应内容等）。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 运行 `dddd version` 的输出。
      placeholder: dddd-next v0.1.50
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 目标为自有资产或已获授权的测试环境
          required: true
        - label: 已确认粘贴内容不含真实业务数据、凭证或未授权目标的敏感信息
          required: true
        - label: 愿意提交修正指纹库或 POC 规则的 PR
          required: false
