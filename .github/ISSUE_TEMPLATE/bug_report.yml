name: Bug 报告（含文档问题）
description: 程序崩溃、报错、行为异常，或文档错误与缺漏
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 issue，确认问题尚未被报告。程序问题请尽量用最新 [Release](https://github.com/galact-byte/dddd-next/releases/latest) 复现；文档问题请提供当前 README 或使用指南的链接及错误位置，无需运行程序。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 程序问题已在最新 Release 复现；文档问题已核对当前 README 或指南
          required: true
        - label: 已搜索现有 issue，没有重复报告
          required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 程序问题填写 `dddd version` 的输出；文档问题可填「不适用」。
      placeholder: dddd-next v0.1.50
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows amd64
        - Linux amd64
        - Linux arm64
        - 自行编译
        - 不适用（文档问题）
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 复现命令或文档位置
      description: 程序问题填写完整命令行；文档问题填写页面链接及错误位置。请删除凭证和敏感目标后再粘贴。
      placeholder: ./dddd -t 192.168.1.1 -p 80,443；或 README「配置须知」的链接和问题描述
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为或正确说明
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为或现有说明
      description: 报错信息、异常输出、截图或有误的原文；日志请去掉无关行。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 例如代理配置、自定义配置目录、`-no-poc` / `-full` 等开关、是否使用测绘语句、复现频率。
    validations:
      required: false
