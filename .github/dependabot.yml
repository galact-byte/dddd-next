version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /third_party/httpx
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-type: all
    # httpx 的版本更新由 source-sync 工作流补齐完整源码及并发补丁。
    open-pull-requests-limit: 1
    groups:
      go-dependencies:
        patterns:
          - "*"
