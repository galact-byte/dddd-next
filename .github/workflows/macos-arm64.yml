name: macOS ARM64

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native architecture
        run: test "$(uname -m)" = arm64

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -trimpath ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w -buildid=" -o "$RUNNER_TEMP/dddd" ./cmd/dddd

      - name: Smoke test executable
        env:
          DDDD_SMOKE_BINARY: ${{ runner.temp }}/dddd
        run: go test -trimpath ./cmd/dddd -run '^TestReleaseBinarySmoke$' -count=1 -v

      - name: Package executable
        run: |
          version="$("$RUNNER_TEMP/dddd" version | awk '{print $2}')"
          staging="$RUNNER_TEMP/macos-package"
          artifacts="$RUNNER_TEMP/macos-artifacts"
          mkdir -p "$staging" "$artifacts"
          cp "$RUNNER_TEMP/dddd" "$staging/dddd"
          chmod +x "$staging/dddd"
          cp LICENSE NOTICE licenses/LEGACY-MIT.txt "$staging/"
          (cd "$staging" && shasum -a 256 dddd > checksums.txt)
          tar -czf "$artifacts/dddd-next_${version}_darwin_arm64.tar.gz" -C "$staging" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dddd-next-macos-arm64
          path: ${{ runner.temp }}/macos-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
