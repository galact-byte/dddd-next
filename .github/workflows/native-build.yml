name: Native builds

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary: dddd.exe
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: dddd
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: dddd
          - runner: macos-14
            goos: darwin
            goarch: arm64
            binary: dddd
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      BINARY_NAME: ${{ matrix.binary }}
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify native platform
        run: |
          test "$(go env GOHOSTOS)" = "$TARGET_OS"
          test "$(go env GOHOSTARCH)" = "$TARGET_ARCH"

      - name: Test
        run: go test -trimpath ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w -buildid=" -o "$RUNNER_TEMP/$BINARY_NAME" ./cmd/dddd

      - name: Smoke test executable
        env:
          DDDD_SMOKE_BINARY: ${{ runner.temp }}/${{ matrix.binary }}
        run: go test -trimpath ./cmd/dddd -run '^TestReleaseBinarySmoke$' -count=1 -v

      - name: Package executable
        run: |
          package_root="$RUNNER_TEMP"
          if [ "$TARGET_OS" = windows ]; then
            package_root="$(cygpath -u "$RUNNER_TEMP")"
          fi
          version="$("$package_root/$BINARY_NAME" version | awk '{print $2}' | tr -d '\r')"
          staging="$package_root/native-package"
          artifacts="$package_root/native-artifacts"
          mkdir -p "$staging" "$artifacts"
          cp "$RUNNER_TEMP/$BINARY_NAME" "$staging/$BINARY_NAME"
          chmod +x "$staging/$BINARY_NAME"
          cp LICENSE NOTICE licenses/LEGACY-MIT.txt "$staging/"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$staging" && sha256sum "$BINARY_NAME" > checksums.txt)
          else
            (cd "$staging" && shasum -a 256 "$BINARY_NAME" > checksums.txt)
          fi
          tar -czf "$artifacts/dddd-next_${version}_${TARGET_OS}_${TARGET_ARCH}.tar.gz" -C "$staging" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dddd-next-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/native-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
